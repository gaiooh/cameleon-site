# Publica o site no GitHub Pages automaticamente.
# Toda vez que um commit chega na branch "main", o GitHub:
#   1. baixa o código, 2. instala as dependências, 3. roda o build
#   (que gera a pasta "out" com o site pronto) e 4. coloca essa pasta no ar.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite rodar na mão pela aba "Actions"

permissions:
  contents: read
  pages: write
  id-token: write

# Se dois commits chegarem juntos, só o mais recente é publicado.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar o Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Gerar o site estático
        run: npm run build
        env:
          # endereço base do site, ex.: "/cameleon-site"
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
